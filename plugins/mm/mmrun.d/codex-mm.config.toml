# mmrun review layer: codex exec -p mm ...
# Only default_permissions here: permission profiles do not compose with sandbox_mode.
# Do not pass -s/--sandbox on the command line either — it overrides the path denies of default_permissions.
default_permissions = "mm_ro"

# Shell commands cannot read other models' output, Claude transcripts or the grok/agy state dirs, so cross-review isn't biased.
# MCP servers and plugins are not covered here: codex does not sandbox them, so mmrun turns them off with -c on every run.
# ⛔ This profile definition must live in the same config layer as default_permissions: putting it in the base config.toml
#    makes codex without -p (desktop app / bare CLI) fail at startup.
# ⛔ -c default_permissions=… and -s on the command line both disable the denies; only the -p config layer works.
[permissions.mm_ro.filesystem]
":root" = "read"
"@HOME@/.claude/mmruns" = "deny"
"@HOME@/.claude/projects" = "deny"
"@HOME@/.grok" = "deny"
"@HOME@/.gemini" = "deny"
"/private/tmp/claude-@UID@" = "deny"
